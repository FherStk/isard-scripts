- name: "INSTALL DMOJv4"
  vars:
    DMOJ_USER: "dmoj"
    DMOJ_PATH: "/etc/dmoj"
    DMOJ_SITE: "{{ DMOJ_PATH }}/site"
    DMOJ_MEDIA: "{{ DMOJ_PATH }}/media"
    DMOJ_VENV: "{{ DMOJ_PATH }}/dmojsite"
    PY_VER: "python3.12"
    JUDGE_NAME: "default"
    JUDGE_KEY: "5qwU1VFlfiv1wi1PHsXG7Z2nQika73VyLOvk3Dcd3Ma/PajJw/VRzNHc7o7lg5CfRvPvGfLOmjjmGmT1im6D3dSu0FwsQyINANhW"
  block:

  - name: "»» Adding deadsnakes PPA for Python 3.12"
    apt_repository:
      repo: ppa:deadsnakes/ppa
      state: present
      update_cache: yes

  - name: "»» Installing APT dependencies"
    apt:
      name:
        - gcc
        - g++
        - make
        - python3.12
        - python3.12-venv
        - python3.12-dev
        - python3-pip
        - libxml2-dev
        - libxslt1-dev
        - zlib1g-dev
        - gettext
        - curl
        - redis-server
        - pkg-config
        - mariadb-server
        - libmysqlclient-dev
        - python3-pymysql
        - build-essential
        - libseccomp-dev
        - default-jdk
        - supervisor
        - nginx
      state: latest

  - name: "»» Checking NodeJS 22 repository"
    stat:
      path: /etc/apt/sources.list.d/nodesource.list
    register: nodesource_list

  - name: "»» Setting up NodeJS 22 repository"
    shell: curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    when: not nodesource_list.stat.exists

  - name: "»» Installing NodeJS"
    apt:
      name: nodejs
      state: latest

  - name: "»» Installing NPM global dependencies"
    npm:
      name: "{{ item }}"
      global: true
    loop: [sass, postcss-cli, postcss, autoprefixer]

  - name: "»» Creating DMOJ system user"
    user:
      name: "{{ DMOJ_USER }}"
      password: "{{ DMOJ_USER | password_hash('sha512') }}"
      create_home: true
      shell: /bin/bash

  - name: "»» Starting MariaDB service"
    service:
      name: mariadb
      state: started
      enabled: yes

  - name: "»» Creating DMOJ database"
    mysql_db:
      login_unix_socket: /var/run/mysqld/mysqld.sock
      name: dmoj
      state: present
      encoding: utf8mb4
      collation: utf8mb4_general_ci

  - name: "»» Setting up DMOJ database user"
    mysql_user:
      login_unix_socket: /var/run/mysqld/mysqld.sock
      name: "{{ DMOJ_USER }}"
      password: "{{ DMOJ_USER }}"
      priv:
        'dmoj.*': 'ALL,GRANT'
      state: present

  - name: "»» Populating timezones"
    shell: mariadb-tzinfo-to-sql /usr/share/zoneinfo | mariadb mysql
    changed_when: false

  - name: "»» Creating installation directories"
    file:
      path: "{{ item }}"
      state: directory
    loop:
      - "{{ DMOJ_PATH }}"
      - "{{ DMOJ_MEDIA }}"
      - "{{ DMOJ_PATH }}/static"
      - "{{ DMOJ_PATH }}/problems"
      - "{{ DMOJ_PATH }}/problems/aplusb"

  - name: "»» Configuring git safe directories"
    shell: |
      git config --global --add safe.directory {{ DMOJ_SITE }}
      git config --global --add safe.directory {{ DMOJ_PATH }}/judge-server
    changed_when: false

  - name: "»» Cloning DMOJ site"
    git:
      repo: https://github.com/DMOJ/site.git
      dest: "{{ DMOJ_SITE }}"
      version: v4.0.0
      recursive: yes
      update: yes

  - name: "»» Installing Python site requirements"
    pip:
      requirements: "{{ DMOJ_SITE }}/requirements.txt"
      virtualenv: "{{ DMOJ_VENV }}"
      virtualenv_command: "{{ PY_VER }} -m venv"

  - name: "»» Installing additional pip packages"
    pip:
      name: "{{ item }}"
      virtualenv: "{{ DMOJ_VENV }}"
      virtualenv_command: "{{ PY_VER }} -m venv"
    loop:
      - websocket-client
      - mysqlclient
      - pymysql
      - lxml_html_clean
      - redis
      - uwsgi
      - legacy-cgi

  - name: "»» Downloading local_settings.py"
    get_url:
      url: https://raw.githubusercontent.com/DMOJ/docs/master/sample_files/local_settings.py
      dest: "{{ DMOJ_SITE }}/dmoj/local_settings.py"
      force: yes

  - name: "»» Configuring local_settings.py"
    replace:
      path: "{{ DMOJ_SITE }}/dmoj/local_settings.py"
      regexp: "{{ item.regexp }}"
      replace: "{{ item.replace }}"
    loop:
      - regexp: "'This key is not very secure and you should change it.'"
        replace: "'5*9f5q57mqmlz2#f$x1h76&jxy#yortjl1v+l*6hd18$d*yx#0'"
      - regexp: "'<mariadb user password>'"
        replace: "'dmoj'"
      - regexp: "#EVENT_DAEMON_USE = True"
        replace: "EVENT_DAEMON_USE = True"
      - regexp: "#EVENT_DAEMON_POST = 'ws://127.0.0.1:15101/'"
        replace: "EVENT_DAEMON_POST = 'ws://127.0.0.1:15101/'"
      - regexp: "#EVENT_DAEMON_GET = 'ws://<your domain>/event/'"
        replace: "EVENT_DAEMON_GET = 'ws://{{ dmoj_hostname }}/event/'"
      - regexp: "#EVENT_DAEMON_POLL = '/channels/''"
        replace: "EVENT_DAEMON_POLL = '/channels/'"
      - regexp: "#CELERY_BROKER_URL"
        replace: "CELERY_BROKER_URL"
      - regexp: "#CELERY_RESULT_BACKEND"
        replace: "CELERY_RESULT_BACKEND"
      - regexp: "#ALLOWED_HOSTS = \\['dmoj.ca'\\]"
        replace: "ALLOWED_HOSTS = ['*']"
      - regexp: "<desired bridge log path>"
        replace: "{{ DMOJ_PATH }}/bridge.log"

  - name: "»» Adding extra settings to local_settings.py"
    lineinfile:
      path: "{{ DMOJ_SITE }}/dmoj/local_settings.py"
      line: "{{ item }}"
      insertafter: EOF
    loop:
      - "DMOJ_PROBLEM_DATA_ROOT = '{{ DMOJ_PATH }}/problems/'"
      - "REGISTRATION_OPEN = False"
      - "DEFAULT_USER_LANGUAGE = 'JAVA'"
      - "DMOJ_SUBMISSION_SOURCE_VISIBILITY = 'only-own'"
      - "MEDIA_ROOT = '{{ DMOJ_MEDIA }}/'"
      - "MEDIA_URL = '/media/'"
      - "STATIC_ROOT = '{{ DMOJ_PATH }}/static/'"

  - name: "»» Building stylesheets"
    shell: bash make_style.sh
    args:
      chdir: "{{ DMOJ_SITE }}"
    environment:
      PATH: "/usr/local/bin:/usr/bin:/bin"

  - name: "»» Running Django setup commands"
    shell: "{{ DMOJ_VENV }}/bin/python manage.py {{ item }}"
    args:
      chdir: "{{ DMOJ_SITE }}"
    loop:
      - "collectstatic --noinput"
      - "compilemessages"
      - "compilejsi18n"
      - "migrate"

  - name: "»» Loading Django fixtures"
    shell: "{{ DMOJ_VENV }}/bin/python manage.py loaddata {{ item }}"
    args:
      chdir: "{{ DMOJ_SITE }}"
    ignore_errors: true
    loop:
      - navbar
      - language_small
      - demo

  - name: "»» Setting up Django site domain"
    shell: |
      {{ DMOJ_VENV }}/bin/python manage.py shell -c "
      from django.contrib.sites.models import Site
      Site.objects.filter(id=1).update(domain='{{ dmoj_hostname }}', name='{{ dmoj_hostname }}')
      "
    args:
      chdir: "{{ DMOJ_SITE }}"

  - name: "»» Creating admin user"
    shell: |
      {{ DMOJ_VENV }}/bin/python manage.py shell -c "
      from django.contrib.auth.models import User
      u, _ = User.objects.get_or_create(username='admin')
      u.is_superuser = True
      u.is_staff = True
      u.set_password('admin')
      u.save()
      "
    args:
      chdir: "{{ DMOJ_SITE }}"

  - name: "»» Downloading uwsgi.ini"
    get_url:
      url: https://raw.githubusercontent.com/DMOJ/docs/master/sample_files/uwsgi.ini
      dest: "{{ DMOJ_SITE }}/dmoj/uwsgi.ini"
      force: yes

  - name: "»» Configuring uwsgi.ini"
    replace:
      path: "{{ DMOJ_SITE }}/dmoj/uwsgi.ini"
      regexp: "{{ item.regexp }}"
      replace: "{{ item.replace }}"
    loop:
      - regexp: "chdir = <dmoj repo dir>"
        replace: "chdir = {{ DMOJ_VENV }}"
      - regexp: "<dmoj repo dir>"
        replace: "{{ DMOJ_SITE }}"
      - regexp: "<virtualenv path>"
        replace: "{{ DMOJ_VENV }}"

  - name: "»» Downloading supervisor configs"
    get_url:
      url: "https://raw.githubusercontent.com/DMOJ/docs/master/sample_files/{{ item }}"
      dest: "/etc/supervisor/conf.d/{{ item }}"
      force: yes
    loop: [site.conf, bridged.conf, celery.conf, wsevent.conf]

  - name: "»» Configuring supervisor site.conf"
    replace:
      path: /etc/supervisor/conf.d/site.conf
      regexp: "{{ item.regexp }}"
      replace: "{{ item.replace }}"
    loop:
      - regexp: "command=<path to virtualenv>/bin/uwsgi --ini uwsgi.ini"
        replace: "command={{ DMOJ_VENV }}/bin/uwsgi --ini {{ DMOJ_SITE }}/dmoj/uwsgi.ini"
      - regexp: "<path to site>"
        replace: "{{ DMOJ_SITE }}"

  - name: "»» Configuring supervisor bridged.conf"
    replace:
      path: /etc/supervisor/conf.d/bridged.conf
      regexp: "{{ item.regexp }}"
      replace: "{{ item.replace }}"
    loop:
      - regexp: "<path to virtualenv>"
        replace: "{{ DMOJ_VENV }}"
      - regexp: "<path to site>"
        replace: "{{ DMOJ_SITE }}"
      - regexp: "<user to run under>"
        replace: "{{ DMOJ_USER }}"

  - name: "»» Configuring supervisor celery.conf"
    replace:
      path: /etc/supervisor/conf.d/celery.conf
      regexp: "{{ item.regexp }}"
      replace: "{{ item.replace }}"
    loop:
      - regexp: "<path to virtualenv>"
        replace: "{{ DMOJ_VENV }}"
      - regexp: "<path to site>"
        replace: "{{ DMOJ_SITE }}"
      - regexp: "<user to run under>"
        replace: "{{ DMOJ_USER }}"

  - name: "»» Configuring supervisor wsevent.conf"
    replace:
      path: /etc/supervisor/conf.d/wsevent.conf
      regexp: "{{ item.regexp }}"
      replace: "{{ item.replace }}"
    loop:
      - regexp: "<site repo path>"
        replace: "{{ DMOJ_SITE }}"
      - regexp: "<username>"
        replace: "{{ DMOJ_USER }}"

  - name: "»» Configuring nginx"
    copy:
      dest: /etc/nginx/sites-available/default
      content: |
        server {
            listen 80;
            listen [::]:80;

            location /static {
                alias {{ DMOJ_PATH }}/static/;
            }

            location /media {
                alias {{ DMOJ_MEDIA }}/;
            }

            location / {
                uwsgi_pass unix:/tmp/dmoj-site.sock;
                include uwsgi_params;
            }

            location /event/ {
                proxy_pass http://127.0.0.1:15100/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400;
            }

            location /channels/ {
                proxy_pass http://127.0.0.1:15102;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
            }
        }

  - name: "»» Installing WebSocket event server dependencies"
    npm:
      name: "{{ item }}"
      path: "{{ DMOJ_SITE }}"
    loop: [qu, ws, simplesets]

  - name: "»» Configuring WebSocket event server"
    copy:
      dest: "{{ DMOJ_SITE }}/websocket/config.js"
      content: |
        module.exports = {
            get_host: '127.0.0.1',
            get_port: 15100,
            post_host: '127.0.0.1',
            post_port: 15101,
            http_host: '127.0.0.1',
            http_port: 15102,
            longpoll_timeout: 29,
        };

  - name: "»» Downloading problem examples"
    get_url:
      url: "{{ item.url }}"
      dest: "{{ item.dest }}"
      mode: '0644'
    loop:
      - url: https://github.com/DMOJ/docs/raw/master/problem_examples/standard/aplusb/aplusb.zip
        dest: "{{ DMOJ_PATH }}/problems/aplusb/aplusb.zip"
      - url: https://raw.githubusercontent.com/DMOJ/docs/master/problem_examples/standard/aplusb/init.yml
        dest: "{{ DMOJ_PATH }}/problems/aplusb/init.yml"

  - name: "»» Cloning judge server"
    git:
      repo: https://github.com/DMOJ/judge-server.git
      dest: "{{ DMOJ_PATH }}/judge-server"
      recursive: yes
      update: yes

  - name: "»» Installing judge server"
    pip:
      name: "{{ DMOJ_PATH }}/judge-server"
      editable: yes
      virtualenv: "{{ DMOJ_VENV }}"
      virtualenv_command: "{{ PY_VER }} -m venv"

  - name: "»» Inserting judge entry in database"
    shell: >
      mariadb dmoj -e
      "INSERT IGNORE INTO judge_judge (name, auth_key, created, is_blocked, online, description, is_disabled)
      VALUES ('{{ JUDGE_NAME }}', '{{ JUDGE_KEY }}', now(), 0, 0, '', false);"

  - name: "»» Check judge configuration"
    stat:
      path: "{{ DMOJ_PATH }}/problems/judge.yml"
    register: judge_yml_stat

  - name: "»» Creating judge configuration"
    copy:
      dest: "{{ DMOJ_PATH }}/problems/judge.yml"
      content: |
        id: {{ JUDGE_NAME }}
        key: {{ JUDGE_KEY }}
        problem_storage_globs:
        - {{ DMOJ_PATH }}/problems/*
    when: not judge_yml_stat.stat.exists

  - name: "»» Running dmoj-autoconf"
    shell: "{{ DMOJ_VENV }}/bin/dmoj-autoconf >> {{ DMOJ_PATH }}/problems/judge.yml"
    when: not judge_yml_stat.stat.exists

  - name: "»» Creating judge startup script"
    copy:
      dest: "{{ DMOJ_PATH }}/startup.sh"
      mode: "0755"
      content: |
        #!/bin/bash
        . {{ DMOJ_VENV }}/bin/activate
        dmoj -c {{ DMOJ_PATH }}/problems/judge.yml 127.0.0.1

  - name: "»» Creating judge systemd service"
    copy:
      dest: /etc/systemd/system/dmoj-judge.service
      content: |
        [Unit]
        Description=DMOJ judge
        After=network.target

        [Service]
        User={{ DMOJ_USER }}
        ExecStart={{ DMOJ_PATH }}/startup.sh
        Restart=on-failure

        [Install]
        WantedBy=multi-user.target

  - name: "»» Setting permissions"
    file:
      path: "{{ item }}"
      owner: "{{ DMOJ_USER }}"
      group: "{{ DMOJ_USER }}"
      recurse: yes
    loop:
      - "{{ DMOJ_VENV }}"
      - "{{ DMOJ_PATH }}/judge-server"
      - "{{ DMOJ_PATH }}/problems"
      - "{{ DMOJ_SITE }}"
      - "{{ DMOJ_MEDIA }}"
      - "{{ DMOJ_PATH }}/static"

  - name: "»» Setting startup script permissions"
    file:
      path: "{{ DMOJ_PATH }}/startup.sh"
      owner: "{{ DMOJ_USER }}"
      group: "{{ DMOJ_USER }}"

  - name: "»» Starting redis"
    service:
      name: redis-server
      state: started
      enabled: yes

  - name: "»» Reloading supervisor"
    command: supervisorctl update

  - name: "»» Restarting supervisor services"
    command: supervisorctl restart site bridged

  - name: "»» Enabling and starting judge service"
    systemd_service:
      name: dmoj-judge
      enabled: yes
      state: started
      daemon_reload: yes

  - name: "»» Starting nginx"
    service:
      name: nginx
      state: restarted
      enabled: yes

  - name: "»» Adding credentials"
    include_role:
      name: utils/add-credentials
      public: yes
    vars:
      app: "DM::OJ (http://{{ dmoj_hostname }})"
      login: "admin"
      pwd: "admin"

  become: true
