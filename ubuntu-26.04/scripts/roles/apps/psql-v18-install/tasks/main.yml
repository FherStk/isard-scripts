- name: "INSTALL PSQLv18"
  block:
  - name: »» Installing packages
    apt: name="postgresql-18" state=latest      

  - name: »» Adding credentials to the password.info file
    include_role:
      name: utils/add-credentials
      public: yes
    vars:
      app: "PostgreSQL"
      login: "postgres"
      pwd: "postgres"
  become: true    